<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aerodynamics Simulator</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131822; --line: #232c3d; --fg: #dbe3f0; --dim: #7f8ca3;
    --accent: #4dd0e1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
         display: flex; height: 100vh; overflow: hidden; }

  aside { width: 310px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
          overflow-y: auto; padding: 14px; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 14px; gap: 10px; }

  h1 { font-size: 15px; margin: 0 0 12px; letter-spacing: .4px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .9px; color: var(--dim);
       margin: 18px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
  label { display: block; margin: 9px 0 3px; color: var(--dim); font-size: 11px; }
  label span { float: right; color: var(--fg); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, input[type=text], input[type=file], button {
    width: 100%; background: #1b2230; color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 8px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .row { display: flex; gap: 6px; }
  .hint { color: var(--dim); font-size: 11px; margin-top: 6px; }

  #view3d { width: 100%; height: 190px; border-radius: 6px; border: 1px solid var(--line);
            display: block; cursor: grab; }
  #flow { width: 100%; flex: 1; min-height: 0; border-radius: 6px; border: 1px solid var(--line);
          background: #000; image-rendering: auto; }

  #readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 8px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
  .stat b { display: block; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat i { font-style: normal; font-size: 10px; color: var(--dim); text-transform: uppercase;
            letter-spacing: .7px; }
  #plot { width: 100%; height: 74px; background: var(--panel); border: 1px solid var(--line);
          border-radius: 6px; }
  #drop { position: fixed; inset: 0; background: rgba(11,14,20,.9); display: none;
          align-items: center; justify-content: center; font-size: 20px; border: 3px dashed var(--accent); }
  #drop.on { display: flex; }
</style>

<body>
<aside>
  <h1>Aerodynamics Simulator</h1>
  <canvas id="view3d"></canvas>
  <div class="hint">Drag to orbit the 3-D view. The flow solves the silhouette you see from the side.</div>

  <h2>Body</h2>
  <select id="shape">
    <option value="airfoil">Aerofoil (NACA 4-digit)</option>
    <option value="cylinder">Cylinder</option>
    <option value="sphere">Sphere</option>
    <option value="plate">Flat plate</option>
    <option value="cube">Cube</option>
    <option value="teardrop">Teardrop / streamlined body</option>
  </select>
  <label id="nacaRow">NACA code <span id="nacaVal">2412</span></label>
  <input type="text" id="naca" value="2412" maxlength="4">
  <label style="margin-top:10px">Upload model (.obj .stl .glb .fbx)</label>
  <input type="file" id="file" accept=".obj,.stl,.glb,.gltf,.fbx">
  <div class="hint">Blender: export OBJ or glTF (.glb). Y-up, +X pointing downstream.</div>

  <h2>Air</h2>
  <label>Airspeed <span id="vVal">30 m/s</span></label>
  <input type="range" id="v" min="1" max="150" step="1" value="30">
  <label>Flow direction <span id="dirVal">0°</span></label>
  <input type="range" id="dir" min="-25" max="25" step="0.5" value="0">

  <h2>Alignment</h2>
  <label>Angle of attack <span id="aoaVal">4°</span></label>
  <input type="range" id="aoa" min="-90" max="90" step="0.5" value="4">
  <label>Yaw <span id="yawVal">0°</span></label>
  <input type="range" id="yaw" min="-90" max="90" step="1" value="0">
  <label>Roll <span id="rollVal">0°</span></label>
  <input type="range" id="roll" min="-90" max="90" step="1" value="0">
  <label>Body size (chord) <span id="sizeVal">1.00 m</span></label>
  <input type="range" id="size" min="0.05" max="10" step="0.05" value="1">

  <h2>Display</h2>
  <select id="field">
    <option value="speed">Air speed</option>
    <option value="cp">Pressure (Cp)</option>
    <option value="vort">Vorticity</option>
  </select>
  <label style="margin-top:8px"><input type="checkbox" id="tracers" checked style="width:auto"> Streamline tracers</label>
  <label>Resolution <span id="resVal">320 × 180</span></label>
  <input type="range" id="res" min="0" max="4" step="1" value="2">
  <label>Solver speed <span id="subVal">6 steps/frame</span></label>
  <input type="range" id="sub" min="1" max="20" step="1" value="6">
  <div class="row" style="margin-top:10px">
    <button id="pause">Pause</button>
    <button id="reset">Reset flow</button>
  </div>
</aside>

<main>
  <canvas id="flow"></canvas>
  <canvas id="plot"></canvas>
  <div id="readout"></div>
</main>

<div id="drop">Drop a .obj / .stl / .glb / .fbx</div>
</body>
</html>
